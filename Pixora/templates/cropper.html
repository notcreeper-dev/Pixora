<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Crop images online with Pixora. Adjust the crop area and download your result.">
    <meta name="theme-color" content="#FFFFFF">
    <title>Image Cropper | Pixora</title>
    <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/cropper.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
    <script src="{{ url_for('static', filename='js/batch.js') }}" defer></script>
    <script src="{{ url_for('static', filename='js/cropper.js') }}" defer></script>
</head>

<body>

    {% include "_navigation.html" %}


    <main class="container">
        <section class="intro">
            <p class="eyebrow">IMAGE TOOLS</p>
            <h1>Crop your image.</h1>
            <p class="subtitle">
                Select the area you want to keep, adjust the crop,
                and download your image.
            </p>
        </section>

        <section class="cropper-card">
            <label class="upload-button" for="image-input">
                Choose an image
            </label>
            <input type="file" id="image-input" accept="image/png,image/jpeg,image/webp">
            <p class="hint">PNG, JPG, or WebP · Maximum 10 MB</p>

            <div id="editor" hidden>
                <div class="toolbar">
                    <label for="aspect-ratio">Aspect ratio</label>
                    <select id="aspect-ratio">
                        <option value="free">Free</option>
                        <option value="1:1">Square (1:1)</option>
                        <option value="4:3">Landscape (4:3)</option>
                        <option value="3:4">Portrait (3:4)</option>
                        <option value="16:9">Wide (16:9)</option>
                    </select>
                    <button type="button" id="reset-crop">Reset crop</button>
                </div>

                <div id="canvas-container">
                    <canvas id="crop-canvas"></canvas>
                </div>

                <div class="crop-details">
                    <span id="crop-dimensions">Crop dimensions: —</span>
                    <label for="output-format">Output format</label>
                    <select id="output-format">
                        <option value="png">PNG</option>
                        <option value="jpeg">JPG</option>
                        <option value="webp">WebP</option>
                    </select>
                </div>

                <button type="button" id="download-button" class="primary-button">
                    Crop & Download
                </button>
            </div>

            <p id="status-message" role="status" aria-live="polite"></p>
        </section>
    </main>

    {% include "_footer.html" %}
</body>

</html>
