<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Resize images online with Pixora. Set custom dimensions and download your resized image.">
    <meta name="theme-color" content="#FFFFFF">
    <title>Image Resizer | Pixora</title>
    <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/resizer.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
    <script src="{{ url_for('static', filename='js/batch.js') }}" defer></script>
    <script src="{{ url_for('static', filename='js/resizer.js') }}" defer></script>
</head>

<body>

    {% include "_navigation.html" %}

    <main class="container">
        <section class="intro">
            <p class="eyebrow">IMAGE TOOLS</p>
            <h1>Resize your image.</h1>
            <p class="subtitle">
                Set your desired dimensions, preserve the aspect ratio,
                and download your resized image.
            </p>
        </section>

        <section class="resizer-card">
            <label class="upload-button" for="image-input">
                Choose an image
            </label>
            <input type="file" id="image-input" accept="image/png,image/jpeg,image/webp">
            <p class="hint">PNG, JPG, or WebP · Maximum 10 MB</p>

            <div id="editor" hidden>
                <div class="preview-container">
                    <img id="image-preview" alt="Preview of the resized image">
                </div>

                <div class="dimensions">
                    <div class="field">
                        <label for="width-input">Width (px)</label>
                        <input type="number" id="width-input" min="1" max="10000" step="1">
                    </div>

                    <button type="button" id="aspect-lock" aria-pressed="true" title="Toggle aspect ratio lock">
                        🔒 Ratio locked
                    </button>

                    <div class="field">
                        <label for="height-input">Height (px)</label>
                        <input type="number" id="height-input" min="1" max="10000" step="1">
                    </div>
                </div>

                <p id="original-dimensions" class="hint"></p>

                <div class="field format-field">
                    <label for="output-format">Output format</label>
                    <select id="output-format">
                        <option value="original">Keep original format</option>
                        <option value="png">PNG</option>
                        <option value="jpeg">JPG</option>
                        <option value="webp">WebP</option>
                    </select>
                </div>

                <button type="button" id="reset-size" class="secondary-button">
                    Reset dimensions
                </button>

                <button type="button" id="download-button" class="primary-button">
                    Resize & Download
                </button>
            </div>

            <p id="status-message" role="status" aria-live="polite"></p>
        </section>
    </main>

    {% include "_footer.html" %}
</body>

</html>
